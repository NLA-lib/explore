# Search synonyms: a phrase a reader may type -> words or library names it should also match.
# Phrases are matched case-insensitively inside the query.
[synonyms]
"pseudoinverse" = ["pinv"]
"pseudo-inverse" = ["pinv"]
"moore-penrose" = ["pinv"]
"spectral norm" = ["specNorm"]
"operator norm" = ["specNorm"]
"2-norm" = ["specNorm"]
"frobenius" = ["frobNorm"]
"condition number" = ["conditionNumber"]
"hermitian" = ["IsHermitian"]
"symmetric" = ["IsHermitian"]
"positive semidefinite" = ["PosSemidef"]
"psd" = ["PosSemidef"]
"positive definite" = ["PosDef"]
"loewner" = ["PosSemidef"]
"svd" = ["IsSVD", "singularValues"]
"singular value decomposition" = ["IsSVD"]
"low rank" = ["truncatedSVD"]
"best rank" = ["truncatedSVD"]
"least squares" = ["IsLeastSquaresSolution"]
"eigenvalue" = ["eigenvalue", "eigenvalues"]
"gap" = ["eigengap", "singularGap"]
"unitarily invariant" = ["SymmetricGauge", "matrixNorm"]
"schatten" = ["schattenNorm"]
"nuclear" = ["nuclearNorm"]
"trace norm" = ["nuclearNorm"]
"ky fan" = ["kyFanNorm"]
"angle" = ["principalAngle"]
"sin theta" = ["DavisKahan", "principalAngle"]
"projector" = ["IsStarProjection", "rangeProjector"]
"projection" = ["IsStarProjection", "rangeProjector"]
"sub-gaussian" = ["SubGaussian"]
"subgaussian" = ["SubGaussian"]
"sub-exponential" = ["SubExponential"]
"concentration" = ["tail", "bound"]
"gaussian matrix" = ["Gaussian"]
"haar" = ["Haar", "unitary"]
"mgf" = ["moment generating"]
