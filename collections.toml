# Shelves: presentation groups independent of Lean import paths. A collection's `topic` is a shelf
# id (topics.toml `shelves` orders them on the home page); it may name a source folder or not.
# Entries keep their canonical links, and one result may sit in several groups and shelves.
# A new result or definition that no group lists appears in the "Other results and definitions"
# group of the collection whose `sources` (module prefixes; default: the folder named by `topic`)
# match its module most specifically, so every new result lands on a shelf until classified.

[[collections]]
id = "linear-systems"
topic = "LinearSystems"
title = "Solve Ax = b and least squares"
description = "Least-squares foundations and direct factorizations, then the randomized solvers (sketch-and-solve, sketch-and-precondition and iterative sketching, randomized Kaczmarz and sketch-and-project) and the Krylov solvers CG, MINRES and GMRES with their preconditioned forms. Sharpness results are also on the Lower bounds shelf."
sources = ["NLAlib.Regression", "NLAlib.Solvers", "NLAlib.Krylov.LinearSystems"]

