# Overrides of the facets that facets.py reads from declaration names, for the statements
# tables of result pages (docs/explorer-redesign.md). Everything here is optional.
#
# [sources] gives the short name of a citation key in the Source column; without one a key with
# two or more authors is shortened to their initials (`TroppWebber2023` -> "TW") and a key with
# one author to the surname (`Woodruff2014` -> "Woodruff").
#
# [overrides."<full declaration name>"] sets facets of one declaration, for names the grammar
# misses or reads too coarsely:
#
#   algorithm = "RSVD"                      # as in facets.ALGORITHMS
#   measure = "frobenius"                   # a key of facets.MEASURES; "spectral+frobenius" for a sum
#   statistic = "expectation"               # expectation | tail | variance
#   moment = 2                              # E‖·‖² rather than E‖·‖
#   output = "late"                         # plain | late | early
#   law = "Gaussian"
#   details = ["bounded sketch"]
#   exact = true                            # an identity, not a bound
#   label = "any optimal projector"         # the row's Detail cell (or Statement, outside the grammar)
#
# An override for a declaration that no longer exists fails the build, like stale Rates rows.
#
# [precision] maps a precision-model constant to the precision of every statement that reaches it
# (through its statement, never its proof; algorithm pages, AP6 of docs/design/algorithm-pages.md).
# A statement that reaches none is in exact arithmetic. The value is the facet `fc.precision`, the
# Precision filter and column of Rates (shown when the value varies) and the finite-precision
# section of algorithm pages. A constant that no longer exists fails the build.

[sources]

# Early truncation through any optimal projector: the names spell `sub_mul`, not the algorithm.

[precision]
'NLAlib.Computation.IsRelErrSem' = 'standard model, unit roundoff $u$'
'NLAlib.Computation.MatrixFreeRounded' = 'standard model, unit roundoff $u$'
'NLAlib.Computation.IsMatvecErr' = 'standard model, unit roundoff $u$'
'NLAlib.LanczosRun' = 'local-error model, $\varepsilon$'

[overrides."NLAlib.HasSubspaceInjection.measureReal_frobNorm_sub_mul_sq_gt_le"]
algorithm = "RSVD"
output = "early"
label = "any optimal projector; head injection and approximate-multiplication tails"

[overrides."NLAlib.HasSubspaceInjection.measureReal_frobNorm_sub_mul_sq_gt_one_add_mul_le"]
algorithm = "RSVD"
output = "early"
label = "any optimal projector; relative error"

# Sketch-and-solve through the oblique projector, and its unbiasedness
[overrides."NLAlib.integral_frobNorm_one_sub_obliqueProjector_mul_sq_of_hasLaw_gaussianMatrix"]
algorithm = "sketch-and-solve"
output = "plain"
label = "oblique-projector form"

[overrides."NLAlib.integral_frobNorm_one_sub_obliqueProjector_mul_sq_of_hasLaw_haarFrame"]
algorithm = "sketch-and-solve"
output = "plain"
label = "oblique-projector form"

[overrides."NLAlib.integral_sketchAndSolve_of_hasLaw_gaussianMatrix"]
label = "unbiased"

[overrides."NLAlib.integral_sketchAndSolve_of_hasLaw_haarFrame"]
label = "unbiased"

[overrides."NLAlib.HasSubspaceInjection.measureReal_norm_sub_mulVec_sq_gt_le"]
algorithm = "sketch-and-solve"
output = "plain"

# Bound shapes the names spell after the relation
[overrides."NLAlib.HasSubspaceInjection.measureReal_frobNorm_sub_truncatedSVD_rsvd_sq_gt_add_le"]
label = "through an approximate-multiplication tail, any field"

# Hutch++ lower tail: the trace estimate falls below (1 − ε) tr A
[overrides."Matrix.PosSemidef.measureReal_hutchpp_lt_one_sub_mul_trace_le_of_isSubgaussianVector"]
measure = "trace"
label = "lower tail"

# Hutch++ upper tail: the trace estimate exceeds (1 + ε) tr A
[overrides."Matrix.PosSemidef.measureReal_hutchpp_gt_one_add_mul_trace_le_of_isSubgaussianVector"]
measure = "trace"
label = "upper tail"

# Girard–Hutchinson with one probe is the quadratic form; the names spell `quadForm` (the exact
# variances of the Rates page)
[overrides."NLAlib.variance_quadForm_of_hasLaw_gaussianVector"]
algorithm = "Girard–Hutchinson"

[overrides."NLAlib.variance_quadForm_of_hasLaw_rademacherVector"]
algorithm = "Girard–Hutchinson"

[overrides."NLAlib.variance_quadForm_sqrt_smul_of_hasLaw_uniformSphereVector"]
algorithm = "Girard–Hutchinson"

[overrides."NLAlib.variance_quadForm_of_isHermitian"]
algorithm = "Girard–Hutchinson"
law = "independent coordinates"

# the m-probe second moment about the trace, for any isotropic probes
[overrides."NLAlib.integral_norm_trace_sub_girardHutchinson_sq"]
measure = "abs"
law = "any isotropic probe"

# Lower bounds (NLAlib.LowerBounds): the names spell the conclusion's left side (`exists_lt_…`,
# `le_…`, `mul_le_of_forall_…`), outside the bound grammar; these facets put each beside the
# upper bound it matches on the Rates page (`kind = 'lower'` rows).
[overrides."NLAlib.exists_lt_integral_frobNorm_sub_rsvd_sq_of_isLeftUnitarilyInvariant"]
algorithm = "RSVD"
measure = "frobenius"
statistic = "expectation"
moment = 2
output = "plain"
law = "rotation-invariant"
label = "lower bound"

[overrides."NLAlib.exists_lt_integral_nuclearNorm_sub_nystrom_of_isLeftUnitarilyInvariant"]
algorithm = "Nyström"
measure = "nuclear"
statistic = "expectation"
moment = 1
output = "plain"
law = "rotation-invariant"
label = "lower bound"

[overrides."NLAlib.exists_lt_integral_frobNorm_sub_generalizedNystrom_sq_of_isLeftUnitarilyInvariant_of_hasLaw_gaussianMatrix"]
algorithm = "GN"
measure = "frobenius"
statistic = "expectation"
moment = 2
output = "plain"
law = "Gaussian"
label = "lower bound"

[overrides."NLAlib.exists_forall_le_integral_frobNorm_sub_earlyTruncatedRSVD_sq_of_hasLaw_gaussianMatrix"]
algorithm = "RSVD"
measure = "frobenius"
statistic = "expectation"
moment = 2
output = "early"
law = "Gaussian"
label = "lower bound"

[overrides."NLAlib.mul_le_of_forall_integral_frobNorm_sub_truncatedSVD_generalizedNystrom_fromBlocks_sq_le"]
algorithm = "GN"
measure = "frobenius"
statistic = "expectation"
moment = 2
output = "late"
law = "Gaussian"
label = "lower bound"

[overrides."NLAlib.exists_hasOrthonormalCols_le_lintegral_frobNorm_mul_sub_mul_sketchAndSolve_sq"]
algorithm = "sketch-and-solve"
measure = "frobenius"
statistic = "expectation"
moment = 2
output = "plain"
label = "minimax lower bound, any sketch law"
