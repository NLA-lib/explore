# The Books page (nla-lib.org/explore/books/): for each key book, its chapters, sections and
# numbered results, each shown with the library results whose docstrings cite it
# (`[Tropp2015, Theorem 6.1.1]`, `[Tropp2015, §6.6]`). Only numbers and short names are listed
# here, never statements; they were read off the book's own headings. `same` maps a result the
# book restates to the number the library cites (Tropp states matrix Bernstein and Lieb's theorem
# early and again where they are proved). Books are listed alphabetically by author.
# Horn and Johnson: the 2013 second edition. Vershynin: the February 2020 online version, whose
# numbering matches every citation of the 2018 printed book in the library.

[[book]]
key = "HornJohnson2013"
short = "Horn and Johnson, Matrix Analysis"
