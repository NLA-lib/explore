notes = '''Real symmetric $\mathbf{A}$. For any real $\mathbf{A}$ the variance is $2\|\mathbf{H}\|_{\mathsf{F}}^2$, with $\mathbf{H}=\tfrac12(\mathbf{A}+\mathbf{A}^{\mathsf{T}})$: `NLAlib.variance_quadForm_of_hasLaw_gaussianVector_hermitianPart`.'''
algorithm_definition = 'NLAlib.gaussianVector'
statement_hash = '6dbdb147df7e9001fc5f80cc62905c450fe685c2a695ec36c28bffdfc7050496'

[[rates]]
id = 'trace-rademacher'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_of_hasLaw_rademacherVector'
family = 'trace-estimation'
algorithm = 'Girard–Hutchinson'
probe = 'Rademacher'
probe_class = 'Real'
probe_law = 'Rademacher'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=2\bigl(\|\mathbf{A}\|_{\mathsf{F}}^2-\sum_i a_{ii}^2\bigr)$''' }]
notes = '''Real symmetric $\mathbf{A}$. For any real $\mathbf{A}$ the variance is $2\bigl(\|\mathbf{H}\|_{\mathsf{F}}^2-\sum_i a_{ii}^2\bigr)$, with $\mathbf{H}=\tfrac12(\mathbf{A}+\mathbf{A}^{\mathsf{T}})$: `NLAlib.variance_quadForm_of_hasLaw_rademacherVector_hermitianPart`. Optimal among real probes with independent coordinates (Hutchinson): for real symmetric $\mathbf{A}$, $\operatorname{Var}(\boldsymbol{\varepsilon}^{\mathsf{T}}\mathbf{A}\boldsymbol{\varepsilon})\le\operatorname{Var}(\mathbf{x}^{\mathsf{T}}\mathbf{A}\mathbf{x})$ for every random vector $\mathbf{x}$ whose coordinates are independent and in $L^4$, each with mean $0$, variance $1$ and the same fourth moment, on any probability space: `NLAlib.variance_quadForm_of_hasLaw_rademacherVector_le`.'''
algorithm_definition = 'NLAlib.rademacherVector'
statement_hash = 'a3a9a7ec01bf40dcece01d898cba851686cc9d6a535838d613ea7af874a115a6'

[[rates]]
id = 'trace-independent-coordinates'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_of_isHermitian'
family = 'trace-estimation'
algorithm = 'Girard–Hutchinson'
probe = 'Independent coordinates, fourth moment m₄'
probe_class = 'Real'
probe_law = 'Independent coordinates'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=2\|\mathbf{A}\|_{\mathsf{F}}^2+(m_4-3)\sum_i a_{ii}^2$''' }]
notes = '''Real symmetric $\mathbf{A}$; $\boldsymbol{\omega}$ has independent real coordinates $\omega_i$ in $L^4$ with $\mathbb{E}\,\omega_i=0$, $\mathbb{E}\,\omega_i^2=1$ and $\mathbb{E}\,\omega_i^4=m_4$ for every $i$. The real Gaussian ($m_4=3$) and Rademacher ($m_4=1$) rows are the special cases; since $m_4\ge1$, random signs give the least variance.'''
statement_hash = 'e0dbdaa69c5301fd5c11bc78917ea6e4ff8ff5968f5202d647cedd8a3c333583'

