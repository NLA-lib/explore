[[guarantees]]
id = 'expected-relative-regression-frobenius'
family = 'regression'
title = '''$(1+\varepsilon)$ least-squares residual · expected squared Frobenius error'''
description = '''For fixed $\mathbf{A}$ and $\mathbf{B}$, the sketched least-squares output $\widehat{\mathbf{X}}=(\mathbf{S}\mathbf{A})^{+}\mathbf{S}\mathbf{B}$ satisfies $\mathbb{E}\|\mathbf{B}-\mathbf{A}\widehat{\mathbf{X}}\|_{\mathsf{F}}^2\le(1+\varepsilon)\operatorname{OPT}_{\mathrm{LS}}^2$, where $\operatorname{OPT}_{\mathrm{LS}}^2=\min_{\mathbf{Y}}\|\mathbf{B}-\mathbf{A}\mathbf{Y}\|_{\mathsf{F}}^2$. The expectation is of the squared residual over the sketch; this is neither a coefficient-error bound nor a rank-k approximation bound. Row-specific distribution, size and rank conditions apply.'''
definitions = [{label = 'Sketch-and-solve', declaration = 'NLAlib.sketchAndSolve'}, {label = 'Least-squares solution', declaration = 'NLAlib.IsLeastSquaresSolution'}]

[[guarantees]]
id = 'high-prob-relative-regression-frobenius'
family = 'regression'
title = '''$(1+\varepsilon)$ least-squares residual · high probability'''
description = '''For fixed $\mathbf{A}$ and $\mathbf{B}$, with probability at least $1-\delta$, the sketched least-squares output $\widehat{\mathbf{X}}=(\mathbf{S}\mathbf{A})^{+}\mathbf{S}\mathbf{B}$ satisfies $\|\mathbf{B}-\mathbf{A}\widehat{\mathbf{X}}\|_{\mathsf{F}}^2\le(1+\varepsilon)\operatorname{OPT}_{\mathrm{LS}}^2$, where $\operatorname{OPT}_{\mathrm{LS}}^2=\min_{\mathbf{Y}}\|\mathbf{B}-\mathbf{A}\mathbf{Y}\|_{\mathsf{F}}^2$. Each fixed input pair has its own success event; a single sketch need not work simultaneously for every input. Row-specific distribution, size, rank and parameter conditions apply.'''
definitions = [{label = 'Sketch-and-solve', declaration = 'NLAlib.sketchAndSolve'}, {label = 'Least-squares solution', declaration = 'NLAlib.IsLeastSquaresSolution'}]

