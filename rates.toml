[[guarantees]]
id = '''krylov-expected-relative-spectral'''
family = '''low-rank-krylov'''
title = '''$(1+\varepsilon)$ low-rank approximation · expected squared spectral error'''
description = '''For every fixed real matrix $\mathbf{A}$, the named output $\widehat{\mathbf{A}}$ satisfies $\mathbb{E}\|\mathbf{A}-\widehat{\mathbf{A}}\|_2^2\le(1+\varepsilon)\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_r\|_2^2=(1+\varepsilon)\,\sigma_r(\mathbf{A})^2$, with singular values indexed from $0$. The expectation is of the squared error, over the Gaussian test matrix. Untruncated outputs may have rank larger than $r$; row-specific gap and block-size conditions apply.'''
definitions = [{ label = '''Best rank-r truncation''', declaration = '''NLAlib.truncatedSVD''' }, { label = '''Relative singular gap (gapped rows)''', declaration = '''NLAlib.singularGapRatio''' }]

[[guarantees]]
id = '''krylov-expected-relative-frobenius'''
family = '''low-rank-krylov'''
title = '''$(1+\varepsilon)$ low-rank approximation · expected squared Frobenius error'''
description = '''For every fixed real matrix $\mathbf{A}$, the named output $\widehat{\mathbf{A}}$ satisfies $\mathbb{E}\|\mathbf{A}-\widehat{\mathbf{A}}\|_{\mathsf{F}}^2\le(1+\varepsilon)\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_r\|_{\mathsf{F}}^2$. The expectation is of the squared error, over the Gaussian test matrix. Only gapped Frobenius rates are proved; row-specific gap and block-size conditions apply.'''
definitions = [{ label = '''Best rank-r truncation''', declaration = '''NLAlib.truncatedSVD''' }, { label = '''Relative singular gap''', declaration = '''NLAlib.singularGapRatio''' }]

[[guarantees]]
id = '''krylov-expected-relative-psd-spectral'''
family = '''low-rank-krylov'''
title = '''$(1+\varepsilon)$ PSD low-rank approximation · expected spectral error'''
description = '''For every fixed real positive semidefinite matrix $\mathbf{H}$, the named Nyström output $\widehat{\mathbf{H}}$ satisfies $\mathbb{E}\|\mathbf{H}-\widehat{\mathbf{H}}\|_2\le(1+\varepsilon)\|\mathbf{H}-\llbracket\mathbf{H}\rrbracket_r\|_2=(1+\varepsilon)\,\sigma_r(\mathbf{H})$, with indices from $0$. The spectral error is not squared; the expectation is over the Gaussian test matrix. Row-specific gap and block-size conditions apply.'''
definitions = [{ label = '''Nyström''', declaration = '''NLAlib.nystrom''' }, { label = '''Best rank-r truncation''', declaration = '''NLAlib.truncatedSVD''' }, { label = '''Relative singular gap (gapped rows)''', declaration = '''NLAlib.singularGapRatio''' }]

