[[guarantees]]
id = '''krylov-expected-relative-spectral'''
family = '''low-rank-krylov'''
title = '''$(1+\varepsilon)$ low-rank approximation · expected squared spectral error'''
description = '''For every fixed real matrix $\mathbf{A}$, the named output $\widehat{\mathbf{A}}$ satisfies $\mathbb{E}\|\mathbf{A}-\widehat{\mathbf{A}}\|_2^2\le(1+\varepsilon)\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_r\|_2^2=(1+\varepsilon)\,\sigma_r(\mathbf{A})^2$, with singular values indexed from $0$. The expectation is of the squared error, over the Gaussian test matrix. Untruncated outputs may have rank larger than $r$; row-specific gap and block-size conditions apply.'''
definitions = [{ label = '''Best rank-r truncation''', declaration = '''NLAlib.truncatedSVD''' }, { label = '''Relative singular gap (gapped rows)''', declaration = '''NLAlib.singularGapRatio''' }]

