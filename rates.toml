definitions = [{ label = '''Nyström''', declaration = '''NLAlib.nystrom''' }, { label = '''Best rank-r truncation''', declaration = '''NLAlib.truncatedSVD''' }, { label = '''Relative singular gap (gapped rows)''', declaration = '''NLAlib.singularGapRatio''' }]

