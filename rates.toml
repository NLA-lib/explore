[[guarantees]]
id = 'trace-single-probe'
family = 'trace-estimation'
title = '''One probe: $\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega}$'''
description = '''For a fixed real square $\mathbf{A}$ and one random isotropic real probe $\boldsymbol{\omega}$, the estimate is the quadratic form $\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega}$, the Girard–Hutchinson estimate with $m=1$. Its mean is $\operatorname{tr}\mathbf{A}$. Each row gives its exact variance $\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})$.'''
definitions = [{ label = 'Quadratic form', declaration = 'NLAlib.quadForm' }, { label = 'Girard–Hutchinson estimate', declaration = 'NLAlib.girardHutchinson' }]

[[guarantees]]
id = 'trace-several-probes'
family = 'trace-estimation'
title = '''Several probes: $\mathsf{girardHutchinson}(\mathbf{A},\mathbf{\Omega})=\operatorname{tr}(\mathbf{\Omega}^{\mathsf{H}}\mathbf{A}\mathbf{\Omega})/m$'''
description = '''The average of the single-probe estimates over the $m$ columns of the test matrix $\mathbf{\Omega}$, with mean $\operatorname{tr}\mathbf{A}$. With independent probes its variance is the single-probe variance divided by $m$. With the $k$ orthonormal probes $\sqrt{n}\,\mathbf{Q}$ of a Haar frame, which are dependent, it is the variance of $k$ independent sphere probes times $(n-k)/(n-1)$, and $0$ at $k=n$.'''
definitions = [{ label = 'Girard–Hutchinson estimate', declaration = 'NLAlib.girardHutchinson' }, { label = 'Isotropic random vector', declaration = 'NLAlib.IsIsotropic' }]

[[rates]]
id = 'trace-real-gaussian'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_of_hasLaw_gaussianVector'
label = 'Real Gaussian'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=2\|\mathbf{A}\|_{\mathsf{F}}^2$''' }]
notes = '''Real symmetric $\mathbf{A}$. For any real $\mathbf{A}$ the variance is $2\|\mathbf{H}\|_{\mathsf{F}}^2$, with $\mathbf{H}=\tfrac12(\mathbf{A}+\mathbf{A}^{\mathsf{T}})$: `NLAlib.variance_quadForm_of_hasLaw_gaussianVector_hermitianPart`.'''
algorithm_definition = 'NLAlib.gaussianVector'
statement_hash = '2929fc93ca46347fac79fe7b06d0b353c448b806bd44480428f2186d1e19c435'

[[rates]]
id = 'trace-rademacher'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_of_hasLaw_rademacherVector'
label = 'Rademacher'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=2\bigl(\|\mathbf{A}\|_{\mathsf{F}}^2-\sum_i a_{ii}^2\bigr)$''' }]
notes = '''Real symmetric $\mathbf{A}$. For any real $\mathbf{A}$ the variance is $2\bigl(\|\mathbf{H}\|_{\mathsf{F}}^2-\sum_i a_{ii}^2\bigr)$, with $\mathbf{H}=\tfrac12(\mathbf{A}+\mathbf{A}^{\mathsf{T}})$: `NLAlib.variance_quadForm_of_hasLaw_rademacherVector_hermitianPart`. Optimal among real probes with independent coordinates (Hutchinson): for real symmetric $\mathbf{A}$, $\operatorname{Var}(\boldsymbol{\varepsilon}^{\mathsf{T}}\mathbf{A}\boldsymbol{\varepsilon})\le\operatorname{Var}(\mathbf{x}^{\mathsf{T}}\mathbf{A}\mathbf{x})$ for every random vector $\mathbf{x}$ whose coordinates are independent and in $L^4$, each with mean $0$, variance $1$ and the same fourth moment, on any probability space: `NLAlib.variance_quadForm_le_of_hasLaw_rademacherVector`.'''
algorithm_definition = 'NLAlib.rademacherVector'
statement_hash = '117b66e9acce7dc46339382732b46363e94db29f3b03c6110c03e0b6183eac75'

[[rates]]
id = 'trace-independent-coordinates'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_of_isHermitian'
label = 'Independent coordinates, fourth moment m₄'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=2\|\mathbf{A}\|_{\mathsf{F}}^2+(m_4-3)\sum_i a_{ii}^2$''' }]
notes = '''Real symmetric $\mathbf{A}$; $\boldsymbol{\omega}$ has independent real coordinates $\omega_i$ in $L^4$ with $\mathbb{E}\,\omega_i=0$, $\mathbb{E}\,\omega_i^2=1$ and $\mathbb{E}\,\omega_i^4=m_4$ for every $i$. The real Gaussian ($m_4=3$) and Rademacher ($m_4=1$) rows are the special cases; since $m_4\ge1$, random signs give the least variance.'''
statement_hash = '98ac6851bbb3ac7c53d6c39d35026ff72a229a6f52f0ad8663b96e1564c29824'

[[rates]]
id = 'trace-real-sphere'
kind = 'exact'
theorem = 'NLAlib.variance_quadForm_sqrt_smul_of_hasLaw_uniformSphereVector'
label = 'Real sphere, radius √n'
guarantee = 'trace-single-probe'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}(\boldsymbol{\omega}^{\mathsf{T}}\mathbf{A}\boldsymbol{\omega})=\dfrac{2n}{n+2}\Bigl(\|\mathbf{A}\|_{\mathsf{F}}^2-\dfrac{(\operatorname{tr}\mathbf{A})^2}{n}\Bigr)$''' }]
notes = '''Real symmetric $\mathbf{A}$; $\boldsymbol{\omega}=\sqrt{n}\,\mathbf{u}$ with $\mathbf{u}$ uniform on the unit sphere of $\mathbb{R}^n$; every dimension $n$. For any real $\mathbf{A}$, replace $\|\mathbf{A}\|_{\mathsf{F}}$ by $\|\mathbf{H}\|_{\mathsf{F}}$, keeping $\operatorname{tr}\mathbf{A}$: `NLAlib.variance_quadForm_sqrt_smul_of_hasLaw_uniformSphereVector_hermitianPart`.'''
algorithm_definition = 'NLAlib.uniformSphereVector'
statement_hash = '5d11924b78b57521a231b59782eb66488c60f954f990038d4aa87b07bd7cf520'

[[rates]]
id = 'trace-haar-frame'
kind = 'exact'
theorem = 'NLAlib.variance_girardHutchinson_sqrt_smul_of_hasLaw_haarFrame'
label = 'Haar frame, k orthonormal probes'
guarantee = 'trace-several-probes'
resources = [{ label = 'Variance', bound = '''$\operatorname{Var}\Bigl[\dfrac{n}{k}\operatorname{tr}(\mathbf{Q}^{\mathsf{T}}\mathbf{A}\mathbf{Q})\Bigr]=\dfrac{2n(n-k)}{k(n-1)(n+2)}\Bigl(\|\mathbf{A}\|_{\mathsf{F}}^2-\dfrac{(\operatorname{tr}\mathbf{A})^2}{n}\Bigr)$''' }]
notes = '''Real symmetric $\mathbf{A}$; $\mathbf{\Omega}=\sqrt{n}\,\mathbf{Q}$ for an $n\times k$ Haar frame $\mathbf{Q}$, with $1\le k\le n$ and $n\ge2$. The compression $\operatorname{tr}(\mathbf{Q}^{\mathsf{T}}\mathbf{A}\mathbf{Q})$ itself has variance $\frac{2k(n-k)}{(n-1)n(n+2)}\bigl(\|\mathbf{A}\|_{\mathsf{F}}^2-(\operatorname{tr}\mathbf{A})^2/n\bigr)$ (`NLAlib.variance_trace_conjTranspose_mul_mul_of_hasLaw_haarFrame`), and for any real $\mathbf{A}$ the same with $\|\mathbf{H}\|_{\mathsf{F}}$ (`NLAlib.variance_trace_conjTranspose_mul_mul_of_hasLaw_haarFrame_hermitianPart`).'''
algorithm_definition = 'NLAlib.haarFrame'
statement_hash = 'c2be10a1a5a960ea0b3e5a737a79bdc9fa4675cb701e76fd58863ba3fc54dae2'

[[rates]]
id = 'trace-independent-probes'
kind = 'exact'
theorem = 'NLAlib.integral_norm_trace_sub_girardHutchinson_sq'
label = 'm independent probes'
guarantee = 'trace-several-probes'
resources = [{ label = '$\mathbb{E}\lvert\operatorname{tr}\mathbf{A}-\cdot\rvert^2$', bound = '''$\mathbb{E}\lvert\operatorname{tr}\mathbf{A}-\mathsf{girardHutchinson}(\mathbf{A},\mathbf{\Omega})\rvert^2=v/m$''' }]
notes = '''$m\ge1$ independent isotropic probes $\boldsymbol{\omega}_j$ (the columns of $\mathbf{\Omega}$), over $\mathbb{R}$ or $\mathbb{C}$, each with a square-integrable estimate and the same single-probe second moment $\mathbb{E}\lvert\boldsymbol{\omega}_j^{\mathsf{H}}\mathbf{A}\boldsymbol{\omega}_j-\operatorname{tr}\mathbf{A}\rvert^2=v$, for instance a value from a one-probe row. Any square $\mathbf{A}$. The real form with $\operatorname{Var}$ in hypothesis and conclusion is `NLAlib.variance_girardHutchinson`.'''
algorithm_definition = 'NLAlib.IsIsotropic'
algorithm_definition_label = 'Isotropy'
statement_hash = '9d4afe9c6fbafe0566abca45bd06fe65e376df33caa00343afed0ef38f2bb553'
