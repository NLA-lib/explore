[[families]]
id = '''embeddings'''
title = '''Embeddings and sketch properties'''
subject_label = '''Sketch'''
subject_field = '''sketch'''
definition_label = '''Property definition'''
filters = [{field = 'algorithm', label = 'Property'}, {field = 'sketch_category', label = 'Sketch class', order = ['Gaussian', 'Haar', 'Sparse', 'Trig', 'Other']}, {field = 'sketch', label = 'Sketch'}, {field = 'variant', label = 'Variant'}]
description = '''Compare sufficient sketch sizes for squared Euclidean distortion. JL concerns a fixed vector; embedding and injection concern every vector in a fixed subspace. Rates apply for sufficiently small positive $\varepsilon$ and the stated failure probability $\delta$.'''
notation = '''Rows $s$, ambient dimension $n$ and $0<\varepsilon\le\varepsilon_0$ for an absolute $\varepsilon_0>0$; meaningful failure probabilities have $0<\delta<1$. Bounds are sufficient thresholds with absolute constants. OSE/OSI succeeds simultaneously on each fixed subspace $U$ of dimension at most $d$; it does not promise a single draw for all subspaces. Distributional JL is per fixed unit vector. All distortions use squared Euclidean norms. Gaussian, sign and sub-Gaussian sketches are $\mathbf{S}=s^{-1/2}\mathbf{X}$; sub-Gaussian rows are independent and isotropic with proxy $c$. Haar uses $\mathbf{S}=\sqrt{n/s}\,\mathbf{Q}^{\mathsf{T}}$. Sampling uses normalized rows $\mathbf{e}_i^{\mathsf{H}}/\sqrt{s p_i}$, with $\sum_i p_i=1$; uniform sampling has $p_i=1/n$. For sampling, $U=\operatorname{range}\mathbf{U}$ and $d=\operatorname{rank}\mathbf{U}$; $\ell_i(\mathbf{U})$ denotes leverage. SRHT uses $\mathbf{S}=\sqrt{n/s}\,\mathbf{P}^{\mathsf{H}}\mathbf{F}\mathbf{D}$, random signs independent of sampled indices, and a unitary $\mathbf{F}$ with $n|F_{ij}|^2\le\beta$. CountSketch has one independent sign per column with independent uniform row hashes. Oblivious injection includes square-integrable entries and the expectation identity stated in its guarantee. Fixed-subspace injection does not assert this extra property.'''

[[families]]
id = '''low-rank-one-two-pass'''
title = '''One- and two-pass low-rank approximation'''
subject_label = '''Algorithm / sketch'''
filters = [{field = 'algorithm', label = 'Algorithm'}, {field = 'variant', label = 'Variant'}, {field = 'sketch_category', label = 'Sketch class', order = ['Gaussian', 'Haar', 'Sparse', 'Trig', 'Other']}, {field = 'sketch', label = 'Sketch'}, {field = 'norm', label = 'Norm'}, {field = 'mode', label = 'Guarantee mode'}]
description = '''Compare sufficient sketch sizes for relative error $1+\varepsilon$, for sufficiently small positive $\varepsilon$. $\operatorname{OPT}_k$ is the best rank-$k$ error in the indicated norm; the basic outputs may have rank larger than $k$.'''
notation = '''Real matrices and $0<\varepsilon\le\varepsilon_0$ for an absolute $\varepsilon_0>0$; rates give sufficient sample thresholds with absolute constants. Gaussian sketches have standard independent entries, with independent range and co-range sketches for generalized Nyström. Nyström requires $\mathbf{H}\succeq0$. Rotation-invariant sketches have a left unitarily invariant probability law and full column rank almost surely. $\widehat{\mathbf{A}}$ or $\widehat{\mathbf{H}}$ is the named algorithm output; late truncation takes its best rank-$k$ approximation, while early truncation truncates the sketch first. $\operatorname{OPT}_{\mathsf{F},k}^2=\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_k\|_{\mathsf{F}}^2$ and $\operatorname{OPT}_{*,k}=\|\mathbf{H}-\llbracket\mathbf{H}\rrbracket_k\|_*$. Frobenius guarantees take the expectation of the squared error.'''

[[families]]
id = '''low-rank-krylov'''
title = '''Block Krylov and subspace iteration'''
subject_label = '''Algorithm'''
filters = [{field = 'algorithm', label = 'Algorithm', order = ['Randomized block Krylov (RBKI)', 'Randomized subspace iteration (RSI)', 'Block Krylov Nyström (NysBKI)', 'Nyström subspace iteration (NysSI)']}, {field = 'gap', label = 'Spectral gap', order = ['Gapless', 'Gapped']}, {field = 'variant', label = 'Variant', order = ['Basic', 'Late truncation']}, {field = 'norm', label = 'Norm', order = ['Spectral squared', 'Frobenius squared', 'Spectral', 'Nuclear']}]
description = '''Compare the resources for expected relative error $1+\varepsilon$ against the best rank-$r$ error, for sufficiently small positive $\varepsilon$. Each row gives two: the block size $\ell$ (columns of the Gaussian test matrix) and the iteration depth, $q$ blocks for block Krylov methods or $p$ power steps for subspace iteration. The block size is a fixed threshold; only the depth grows with $1/\varepsilon$. Gapless rates hold for every input; gapped rates assume a positive relative singular gap $\gamma$.'''
notation = '''Real matrices $\mathbf{A}\in\mathbb{R}^{m\times n}$; Nyström rows take positive semidefinite $\mathbf{H}\in\mathbb{R}^{n\times n}$. The test matrix $\mathbf{X}\in\mathbb{R}^{n\times\ell}$ has independent standard Gaussian entries, unnormalized, and the block size satisfies $\ell\ge r+2$ for target rank $r$ (gapped rows: $\ell\ge t+2$ for their tail index $t\ge r$). This family writes the target rank $r$, as its theorems do; the one- and two-pass family writes $k$. Rates are sufficient thresholds $q\ge C\cdot(\ldots)$ or $p\ge C\cdot(\ldots)$ with absolute constants, for $0<\varepsilon\le\varepsilon_0$ with an absolute $\varepsilon_0>0$; $n$ is the number of columns of $\mathbf{A}$ (the size of $\mathbf{H}$). RBKI with $q$ blocks returns $\mathbf{P}\mathbf{A}$, with $\mathbf{P}$ the orthogonal projector onto the range of $\mathbf{A}[\mathbf{X},\,\mathbf{A}^{\mathsf{T}}\mathbf{A}\mathbf{X},\dots,(\mathbf{A}^{\mathsf{T}}\mathbf{A})^{q-1}\mathbf{X}]$ ($2q$ products with $\mathbf{A}$ or $\mathbf{A}^{\mathsf{T}}$ in Tropp and Webber's count). RSI with $p$ power steps is the randomized SVD with test matrix $(\mathbf{A}^{\mathsf{T}}\mathbf{A})^p\mathbf{X}$ ($2p+2$ products). NysBKI is Nyström with the block Krylov matrix $[\mathbf{X},\mathbf{H}\mathbf{X},\dots,\mathbf{H}^{q-1}\mathbf{X}]$ ($q$ products); NysSI is Nyström with $\mathbf{H}^p\mathbf{X}$ ($p+1$ products). Late truncation returns the best rank-$r$ approximation of the output. Singular values are indexed from $0$, so $\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_r\|_2=\sigma_r(\mathbf{A})$. Gapped rows fix a head of $r\ge1$ singular values and a tail index $t$ with $r\le t\le\ell-2$, and assume $\gamma=(\sigma_{r-1}-\sigma_t)/(\sigma_{r-1}+\sigma_t)>0$; for Nyström rows these are singular values (eigenvalues) of $\mathbf{H}$. Spectral and Frobenius errors of general matrices are squared; Nyström spectral errors are not.'''

[[families]]
id = 'regression'
title = 'Regression'
subject_label = 'Sketch'
subject_field = 'sketch'
filters = [{field = 'sketch_category', label = 'Sketch class', order = ['Gaussian', 'Haar', 'Sparse', 'Trig', 'Other']}, {field = 'sketch', label = 'Sketch'}, {field = 'mode', label = 'Guarantee mode'}]
description = '''Compare sufficient sketch sizes for relative least-squares residual error. The error is the squared Frobenius norm of the residual.'''
notation = '''For fixed matrices $\mathbf{A}\in\Bbbk^{m\times n}$ and $\mathbf{B}\in\Bbbk^{m\times q}$ over the scalar field permitted by the row, let $r=\operatorname{rank}\mathbf{A}$ and $\operatorname{OPT}_{\mathrm{LS}}^2=\min_{\mathbf{Y}}\|\mathbf{B}-\mathbf{A}\mathbf{Y}\|_{\mathsf{F}}^2=\|(\mathbf{I}-\mathbf{A}\mathbf{A}^{+})\mathbf{B}\|_{\mathsf{F}}^2$. A sketch $\mathbf{S}\in\Bbbk^{s\times m}$ produces $\widehat{\mathbf{X}}=\mathsf{sketchAndSolve}(\mathbf{A},\mathbf{S},\mathbf{B})=(\mathbf{S}\mathbf{A})^{+}\mathbf{S}\mathbf{B}$. For absolute $\varepsilon_0>0$, the rates assume $0<\varepsilon\le\varepsilon_0$. The input matrices are fixed before drawing the sketch; expectations and probabilities concern that draw. Resource thresholds, parameter ranges, rank restrictions, sketch normalization and any ambient-dimension cap are supplied by each reviewed row and its exact theorem. Gaussian and Haar rows use real inputs; the CountSketch tail also permits complex inputs. No full-column-rank assumption or coefficient-error guarantee is inferred.'''

[[guarantees]]
id = '''distributional-jl'''
family = '''embeddings'''
title = '''$(1\pm\varepsilon)$ distributional JL'''
description = '''For every fixed unit vector $\mathbf{x}$, $\mathbb{P}[\lvert\|\mathbf{S}\mathbf{x}\|^2-1\rvert\ge\varepsilon]\le\delta$. The vector is fixed before drawing the sketch; this is not simultaneous over all vectors.'''
definitions = [{ label = '''JL property''', declaration = '''NLAlib.HasJLProperty''' }]

[[guarantees]]
id = '''oblivious-subspace-embedding'''
family = '''embeddings'''
title = '''$(1\pm\varepsilon)$ oblivious subspace embedding'''
description = '''For every fixed subspace $U$ of dimension at most $d$, $\mathbb{P}[\forall\,\mathbf{x}\in U:\ (1-\varepsilon)\|\mathbf{x}\|^2\le\|\mathbf{S}\mathbf{x}\|^2\le(1+\varepsilon)\|\mathbf{x}\|^2]\ge1-\delta$. Each subspace has its own success event; a single draw need not succeed on all subspaces at once.'''
definitions = [{ label = '''OSE''', declaration = '''NLAlib.IsObliviousSubspaceEmbedding''' }, { label = '''Fixed-subspace embedding''', declaration = '''NLAlib.HasSubspaceEmbedding''' }]

[[guarantees]]
id = '''fixed-subspace-embedding'''
family = '''embeddings'''
title = '''$(1\pm\varepsilon)$ embedding of a specified subspace'''
description = '''For the specified $U=\operatorname{range}\mathbf{U}$, with $d=\operatorname{rank}\mathbf{U}$, $\mathbb{P}[\forall\,\mathbf{x}\in U:\ (1-\varepsilon)\|\mathbf{x}\|^2\le\|\mathbf{S}\mathbf{x}\|^2\le(1+\varepsilon)\|\mathbf{x}\|^2]\ge1-\delta$. Sampling probabilities may depend on this subspace through its leverage scores; this is not an oblivious guarantee over all subspaces.'''
definitions = [{ label = '''Fixed-subspace embedding''', declaration = '''NLAlib.HasSubspaceEmbedding''' }]

[[guarantees]]
id = '''oblivious-subspace-injection'''
family = '''embeddings'''
title = '''$(1-\varepsilon)$ oblivious subspace injection'''
description = '''The entries of $\mathbf{S}$ are square integrable and $\mathbb{E}[\mathbf{S}^{\mathsf{H}}\mathbf{S}]=\mathbf{I}$; equivalently $\mathbb{E}\|\mathbf{S}\mathbf{x}\|^2=\|\mathbf{x}\|^2$ for every vector. In addition, for every fixed subspace $U$ of dimension at most $d$, $\mathbb{P}[\forall\,\mathbf{x}\in U:\ (1-\varepsilon)\|\mathbf{x}\|^2\le\|\mathbf{S}\mathbf{x}\|^2]\ge1-\delta$. The success event may depend on $U$. Both isotropy and the lower-tail condition are part of OSI.'''
definitions = [{ label = '''OSI''', declaration = '''NLAlib.IsObliviousSubspaceInjection''' }, { label = '''Isotropic sketch''', declaration = '''NLAlib.IsIsotropicSketch''' }, { label = '''Fixed-subspace injection''', declaration = '''NLAlib.HasSubspaceInjection''' }]

[[guarantees]]
id = '''fixed-subspace-injection'''
family = '''embeddings'''
title = '''$(1-\varepsilon)$ injection on a specified subspace'''
description = '''For the specified $U=\operatorname{range}\mathbf{U}$, with $d=\operatorname{rank}\mathbf{U}$, $\mathbb{P}[\forall\,\mathbf{x}\in U:\ (1-\varepsilon)\|\mathbf{x}\|^2\le\|\mathbf{S}\mathbf{x}\|^2]\ge1-\delta$. This conclusion alone does not assert isotropy or OSI; leverage-dependent sampling is tailored to the given subspace.'''
definitions = [{ label = '''Fixed-subspace injection''', declaration = '''NLAlib.HasSubspaceInjection''' }]

[[guarantees]]
id = '''expected-relative-frobenius'''
family = '''low-rank-one-two-pass'''
title = '''$(1+\varepsilon)$ low-rank approximation · expected squared Frobenius error'''
description = '''For every fixed real matrix $\mathbf{A}$, the named output $\widehat{\mathbf{A}}$ satisfies $\mathbb{E}\|\mathbf{A}-\widehat{\mathbf{A}}\|_{\mathsf{F}}^2\le(1+\varepsilon)\|\mathbf{A}-\llbracket\mathbf{A}\rrbracket_k\|_{\mathsf{F}}^2$. The expectation is of the squared error, over the sketches; generalized Nyström uses independent range and co-range sketches. Row-specific rank restrictions and distribution assumptions still apply.'''
definitions = [{ label = '''Best rank-k truncation''', declaration = '''NLAlib.truncatedSVD''' }]

[[guarantees]]
id = '''expected-relative-nuclear'''
family = '''low-rank-one-two-pass'''
title = '''$(1+\varepsilon)$ PSD low-rank approximation · expected nuclear error'''
description = '''For every fixed real positive semidefinite matrix $\mathbf{H}$, the named Nyström output $\widehat{\mathbf{H}}$ satisfies $\mathbb{E}\|\mathbf{H}-\widehat{\mathbf{H}}\|_*\le(1+\varepsilon)\|\mathbf{H}-\llbracket\mathbf{H}\rrbracket_k\|_*$. The expectation is over the sketch. Row-specific rank restrictions and distribution assumptions still apply.'''
definitions = [{ label = '''Nyström''', declaration = '''NLAlib.nystrom''' }, { label = '''Best rank-k truncation''', declaration = '''NLAlib.truncatedSVD''' }]

