# Optional per-result additions, keyed by the `Result:` id in NLAlib docstrings.
# Everything here is optional; without an entry a result's title is the bold name in its first
# docstring (or the id), and its statement is that docstring.
#
#   [weyl-inequality]
#   title = "Weyl's inequality"
#   aliases = ["Weyl's eigenvalue inequality"]          # extra names for the search
#   latex = "For Hermitian $A, B$: $$\\lambda_{i+j}(A+B) \\le \\lambda_i(A) + \\lambda_j(B).$$"
#   primary = "NLAlib.some_explicit_theorem"               # headline explicit declaration
#   novelty = "new"                    # new | improved | extended | corrected | none: a tag
#                                      # after the title ("new" is derived; see below)
#
#   [some-old-id]
#   merge_into = "weyl-inequality"     # show this result's members on that page instead
#
# Titles follow the explorer's vocabulary (docs/explorer-redesign.md, Decisions): no leading
# "The" (the build drops one), "expected error" rather than "average" or "mean", "tail bound"
# rather than "with high probability" or "deviation", "late-truncated" for truncation after the
# algorithm. The build warns about a title that does not.
#
# Novelty. A library-original result carries a coloured tag after its title (its page, the
# shelves, search hits, the Books and file pages, its Rates row), with a tooltip and a legend:
#   new        no published counterpart (red);
#   improved   a published result with a sharper or explicit constant, a better rate, or a weaker
#              hypothesis;
#   extended   a published result generalized to a new setting (field, sketch law, output);
#   corrected  a published statement fixed (a missing hypothesis, a wrong constant).
# "new" is derived: a member docstring saying "No printed source. New (…)" (NLAlib's marker, on the
# OP1 and OP2 lower bounds). A bare "No printed source." is an uncited classical fact (the
# chi-square law, the gamma ratio) and is not new. The other categories, and new results NLAlib
# does not mark that way yet, are set here; `novelty = "none"` drops a derived tag. The routine
# formal generality of a port ("there for real matrices, here over any field") is not tagged.
#
# A merged id keeps working: `#r/<old id>` opens the merged page at the statement that headed
# the old one. A merged entry takes only `aliases` besides `merge_into`.
#
# The statements on a result page are listed in a table whose labels are generated from the
# facets of each declaration (facets.py); facets.toml overrides them per declaration.
#
# Prefer putting the mathematics in the docstring, where it is reviewed with the Lean; use
# `latex` only when the docstring cannot carry it.

